<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Robin ICT Care</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }
        
        .registration-card {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 650px;
            padding: 40px 30px;
            position: relative;
            overflow: hidden;
        }

        .registration-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, #00ffcc, #00b09b);
        }

        .header-title {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .header-title h2 {
            color: #2c5364;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .header-title p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group label {
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-group label i {
            color: #00b09b;
            margin-right: 5px;
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 12px 14px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #00b09b;
            box-shadow: 0 0 8px rgba(0, 176, 155, 0.2);
        }

        .btn-submit {
            grid-column: span 2;
            background: linear-gradient(to right, #00b09b, #96c93d);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        .status-msg {
            display: none;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .status-msg.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-msg.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            .btn-submit {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="registration-card">
        <div class="header-title">
            <h2>শিক্ষার্থী রেজিস্ট্রেশন ফর্ম</h2>
            <p>Robin ICT Care - আপনার পছন্দের ইউজার আইডি ও পাসওয়ার্ড দিয়ে ফরম পূরণ করুন</p>
        </div>

        <div id="statusMessage" class="status-msg"></div>

        <form id="studentRegistrationForm" onsubmit="submitForm(event)">
            <div class="form-grid">
                
                <!-- শিক্ষার্থীর নাম -->
                <div class="form-group full-width">
                    <label for="fullName"><i class="fa-solid fa-user"></i> শিক্ষার্থীর পূর্ণ নাম</label>
                    <input type="text" id="fullName" name="fullName" placeholder="যেমন: মোঃ আল-আমিন" required>
                </div>

                <!-- ইউজার আইডি (শিক্ষার্থী নিজে দিবে) -->
                <div class="form-group">
                    <label for="studentId"><i class="fa-solid fa-id-badge"></i> পছন্দের ইউজার আইডি (User ID)</label>
                    <input type="text" id="studentId" name="studentId" placeholder="যেমন: alamin2026" required>
                </div>

                <!-- পাসওয়ার্ড (শিক্ষার্থী নিজে দিবে) -->
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> পছন্দের পাসওয়ার্ড (Password)</label>
                    <input type="text" id="password" name="password" placeholder="একটি গোপন পাসওয়ার্ড দিন" required>
                </div>

                <!-- পিতার নাম -->
                <div class="form-group">
                    <label for="fatherName"><i class="fa-solid fa-user-tie"></i> পিতার নাম</label>
                    <input type="text" id="fatherName" name="fatherName" placeholder="পিতার নাম লিখুন" required>
                </div>

                <!-- মাতার নাম -->
                <div class="form-group">
                    <label for="motherName"><i class="fa-solid fa-person-breastfeeding"></i> মাতার নাম</label>
                    <input type="text" id="motherName" name="motherName" placeholder="মাতার নাম লিখুন" required>
                </div>

                <!-- মোবাইল নম্বর -->
                <div class="form-group">
                    <label for="phone"><i class="fa-solid fa-phone"></i> মোবাইল নম্বর</label>
                    <input type="tel" id="phone" name="phone" placeholder="017XXXXXXXX" pattern="[0-9]{11}" required>
                </div>

                <!-- কলেজ/শিক্ষা প্রতিষ্ঠান -->
                <div class="form-group">
                    <label for="college"><i class="fa-solid fa-graduation-cap"></i> কলেজ / প্রতিষ্ঠান</label>
                    <input type="text" id="college" name="college" placeholder="যেমন: শলুয়া ডিগ্রি কলেজ" required>
                </div>

                <!-- এইচএসসি ব্যাচ -->
                <div class="form-group">
                    <label for="batch"><i class="fa-solid fa-calendar-days"></i> এইচএসসি ব্যাচ</label>
                    <select id="batch" name="batch" required>
                        <option value="">ব্যাচ নির্বাচন করুন</option>
                        <option value="HSC 2025">HSC 2025</option>
                        <option value="HSC 2026">HSC 2026</option>
                        <option value="HSC 2027">HSC 2027</option>
                    </select>
                </div>

                <!-- ঠিকানা -->
                <div class="form-group full-width">
                    <label for="address"><i class="fa-solid fa-location-dot"></i> বর্তমান ঠিকানা</label>
                    <textarea id="address" name="address" rows="2" placeholder="গ্রাম/মহল্লা, ডাকঘর, উপজেলা, জেলা" required></textarea>
                </div>

                <!-- সাবমিট বাটন -->
                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fa-solid fa-paper-plane"></i> রেজিস্ট্রেশন সম্পন্ন করুন
                </button>

            </div>
        </form>
    </div>

    <script>
    // আপনার Google Apps Script Deploy করার পর পাওয়া Web App URL টি এখানে বসান
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzFsDhVdN68BkIootXTouPiMCR8pTvnUyeqSLTHe2-8T5yGLpjqeg_hxNDLsuEcIbJx/exec';

    function submitForm(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');
        const form = document.getElementById('studentRegistrationForm');

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> সাবমিট হচ্ছে...';
        statusMessage.style.display = 'none';

        const formData = new FormData(form);

        fetch(scriptURL, { 
            method: 'POST', 
            body: formData,
            mode: 'no-cors' // এই লাইনটি CORS জনিত সমস্যা সমাধান করবে
        })
        .then(() => {
            // no-cors মোডে সফলভাবে সাবমিট হলে ধন্যবাদ বার্তা দেখাবে
            statusMessage.className = 'status-msg success';
            statusMessage.innerText = 'অভিনন্দন! আপনার রেজিস্ট্রেশন সফলভাবে সম্পন্ন হয়েছে।';
            statusMessage.style.display = 'block';
            form.reset();
        })
        .catch(error => {
            statusMessage.className = 'status-msg error';
            statusMessage.innerText = 'দুঃখিত! কোনো সমস্যা হয়েছে। আবার চেষ্টা করুন।';
            statusMessage.style.display = 'block';
            console.error('Error!', error.message);
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> রেজিস্ট্রেশন সম্পন্ন করুন';
        });
    }
</script>
</body>
</html>
