<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কাজ চলমান আছে</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #080808;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .neon-container {
            text-align: center;
            padding: 20px;
        }

        .neon-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #ff007f,
                0 0 30px #ff007f,
                0 0 40px #ff007f,
                0 0 55px #ff007f,
                0 0 75px #ff007f;
            animation: pulse 1.5s infinite alternate, flicker 3s infinite;
        }

        /* স্পন্দন বা গ্লো ইফেক্টের অ্যানিমেশন */
        @keyframes pulse {
            0% {
                text-shadow:
                    0 0 4px #fff,
                    0 0 11px #fff,
                    0 0 19px #ff007f,
                    0 0 40px #ff007f,
                    0 0 80px #ff007f;
            }
            100% {
                text-shadow:
                    0 0 2px #fff,
                    0 0 4px #fff,
                    0 0 10px #ff007f,
                    0 0 20px #ff007f,
                    0 0 30px #ff007f,
                    0 0 40px #ff007f;
            }
        }

        /* হালকা ফ্লিকারিং (মিটমিট করা) ইফেক্ট */
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            41.99% { opacity: 1; }
            42% { opacity: 0.8; }
            43% { opacity: 1; }
            45.99% { opacity: 1; }
            46% { opacity: 0.3; }
            46.5% { opacity: 1; }
        }

        /* ছোট স্ক্রিনের জন্য রেসপন্সিভ ডিজাইন */
        @media (max-width: 768px) {
            .neon-text {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="neon-container">
        <h1 class="neon-text">কাজ চলমান আছে অনুগ্রহ করে অন্য অপশন ট্রাই করুন</h1>
    </div>

</body>
</html>
